name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check for Gradle wrapper
        id: gradle-wrapper
        run: |
          if [ -x ./gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Warn when Gradle wrapper is missing
        if: steps.gradle-wrapper.outputs.present == 'false'
        run: |
          echo "Gradle wrapper not found. Add a Gradle wrapper to enable CI builds."

      - name: Cache Gradle packages
        if: steps.gradle-wrapper.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        if: steps.gradle-wrapper.outputs.present == 'true'
        run: ./gradlew build

      - name: Upload build artifacts
        if: steps.gradle-wrapper.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: '**/build/**'
          if-no-files-found: warn
